name: Media fetch (temporary)
on:
  push:
    branches: [media-completion]
    paths: [".github/workflows/media-fetch.yml", "scripts/media_fetch.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python scripts/media_fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images/o-meni
          git commit -qm "Add remaining media images (temporary job)" || echo nothing
          git pull -q --rebase
          git push
