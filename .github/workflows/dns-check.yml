name: DNS check (temporary)
on:
  push:
    branches: [domain-setup]
    paths: [".github/workflows/dns-check.yml"]
permissions:
  contents: write
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look up DNS
        run: |
          mkdir -p _probe
          D=nanamilatic.com
          curl -sS -m 30 https://rdap.verisign.com/com/v1/domain/$D -o _probe/rdap.json || echo "rdap failed" > _probe/rdap.err
          python3 - <<'PY' > _probe/dns.txt
          import json
          d=json.load(open('_probe/rdap.json'))
          print('status:',d.get('status'))
          print('nameservers:',[n.get('ldhName') for n in d.get('nameservers',[])])
          for e in d.get('events',[]): print(e.get('eventAction'),e.get('eventDate'))
          for en in d.get('entities',[]):
              if 'registrar' in en.get('roles',[]):
                  print('registrar entity:')
                  for v in en.get('vcardArray',[None,[]])[1]:
                      if v[0] in ('fn','org'): print(' ',v[0],v[3])
                  print(' ids:',en.get('publicIds'))
          print('links:',[l.get('href') for l in d.get('links',[])])
          PY
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f _probe; git commit -qm "DNS check results (temporary)" || echo nothing
          git pull -q --rebase; git push
