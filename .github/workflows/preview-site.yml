name: Preview site (temporary)

# Builds the Jekyll site on GitHub and publishes the finished HTML to the
# "preview-site" branch, so it can be opened with any plain file server
# (no Ruby/Jekyll needed). Demo posts are added to the preview only.
# Remove this file before merging.
on:
  push:
    branches: [blog-jekyll]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Add demo posts (preview only, not committed to the branch)
        run: |
          cat > _posts/2026-10-14-probni-clanak-sport.md <<'EOF'
          ---
          layout: post
          title: "Probni članak: sport i zdravlje"
          date: 2026-10-14
          image: /images/program/postnatal.jpg
          kategorija: Sport&Zdravlje
          ---
          Ovo je probni članak koji služi samo za pregled izgleda popisa i filtera po kategorijama. Prvi odlomak se prikazuje kao uvod na popisu svih članaka.

          Drugi odlomak teksta. Pravi članci stižu uskoro.
          EOF
          cat > _posts/2026-10-12-probni-clanak-knjiga.md <<'EOF'
          ---
          layout: post
          title: "Probni članak: Nana i knjiga"
          date: 2026-10-12
          image: /images/program/korektivna.jpg
          kategorija: Nana&Knjiga
          ---
          Probni tekst o jednoj knjizi. Ovaj članak postoji samo u pregledu i neće se pojaviti na pravoj stranici.

          Još jedan odlomak, da vidimo kako izgleda dulji tekst na stranici članka.
          EOF
          cat > _posts/2026-10-10-probni-clanak-lifestyle.md <<'EOF'
          ---
          layout: post
          title: "Probni članak s vrlo dugim naslovom da provjerimo kako se lomi u više redova"
          date: 2026-10-10
          image: /images/program/funkcionalni.jpg
          kategorija: lifestyle
          ---
          Treći probni članak, s dugim naslovom, radi provjere izgleda kartice i naslova na stranici članka.
          EOF

      - name: Build (root address, unpublished sample post included)
        run: bundle exec jekyll build --unpublished --trace --baseurl "" -d ../preview-out

      - name: Publish to preview-site branch
        run: |
          cd ../preview-out
          touch .nojekyll
          git init -q -b preview-site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Rendered preview of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-site
