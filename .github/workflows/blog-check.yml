name: Blog check (temporary)

# Builds the site with the same Jekyll version GitHub Pages uses, compares the
# existing pages with the current main branch, and screenshots the new blog pages.
# Results are pushed to the "blog-previews" branch. Remove this file before merging.
on:
  push:
    branches: [blog-jekyll]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: new

      - name: Baseline = current main
        run: git -C new worktree add --detach ../old origin/main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: new

      - name: Build Jekyll (including unpublished sample post)
        working-directory: new
        run: bundle exec jekyll build --unpublished --trace -d ../srv-new/nanafitmama

      - name: Prepare baseline
        run: |
          mkdir -p srv-old/nanafitmama
          cp old/*.html srv-old/nanafitmama/
          cp -r old/images srv-old/nanafitmama/images

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install screenshot tools
        run: |
          mkdir tools && cd tools && npm init -y >/dev/null
          npm i playwright pngjs pixelmatch@5 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Compare and screenshot
        run: |
          python3 -m http.server 8081 --directory srv-old >/dev/null 2>&1 &
          python3 -m http.server 8082 --directory srv-new >/dev/null 2>&1 &
          sleep 2
          cp new/scripts/blog-check/shoot.cjs tools/shoot.cjs
          cd tools && node shoot.cjs ../out

      - name: Publish results to blog-previews branch
        if: always()
        run: |
          cd out
          git init -q -b blog-previews
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Blog check results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" blog-previews
