name: Gallery fetch (temporary)
on:
  push:
    branches: [gallery-completion]
    paths: [".github/workflows/gallery-fetch.yml", "scripts/gallery_fetch.py", "scripts/gallery_ids.json"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python scripts/gallery_fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A images/galerija scripts/gallery_dims.json
          git commit -qm "Add missing gallery images (temporary job)" || echo nothing
          git pull -q --rebase
          git push
