name: Wix migration probe (temporary)

# Fetches all blog posts from the old Wix site into _probe/ (post data, bodies,
# image sizes) so the converter can be built and tested against real content.
on:
  push:
    branches: [wix-migration]
    paths: [".github/workflows/migration-probe.yml", "scripts/wix_fetch.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - name: Fetch all posts
        run: python3 scripts/wix_fetch.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f _probe
          git commit -qm "Probe results from the Wix site (temporary)" || echo "nothing to commit"
          git pull -q --rebase
          git push
