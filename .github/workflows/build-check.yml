name: Build check (temporary)
on:
  push:
    branches: [domain-cutover]
    paths: [".github/workflows/build-check.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build 2>&1 | tee /tmp/build.log
      - name: Report
        if: always()
        run: |
          mkdir -p _probe
          {
            tail -15 /tmp/build.log
            echo "== stubs"; ls _site | head -30
            echo "== galerry"; cat _site/galerry/index.html 2>&1 | head -12
            echo "== diacritic post"; ls -d _site/post/va* 2>&1 | head -5
            echo "== count redirect stubs"; grep -rl "http-equiv=\"refresh\"" _site | wc -l
            echo "== CNAME"; cat _site/CNAME
            echo "== sitemap/feed host"; grep -m2 -o "https://[a-z.]*nanamilatic.com[^<\"]*" _site/feed.xml | head -2
            echo "== links with /nanafitmama"; grep -rl "/nanafitmama" _site | head -3
            echo "== sample href"; grep -o 'href="[^"]*o-meni[^"]*"' _site/index.html | head -2
          } > _probe/build.txt 2>&1
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f _probe; git commit -qm "Build check results (temporary)" || true
          git pull -q --rebase; git push
