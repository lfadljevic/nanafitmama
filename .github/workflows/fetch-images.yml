name: Fetch images

# Runs automatically when pushed to the local-images branch (and can also be
# started manually once this file is on the default branch).
# Downloads the full-size originals into images/<page>/ and commits them.
# Commits made by this workflow do not trigger another run.
on:
  push:
    branches: [local-images]
    paths: [".github/workflows/fetch-images.yml", "scripts/fetch_images.py", "images/manifest.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Add full-size images downloaded from Wix"
          git push
