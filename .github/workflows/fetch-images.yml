name: Fetch images

# Run manually: Actions tab -> "Fetch images" -> Run workflow.
# Downloads the full-size originals into images/<page>/ and commits them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Add full-size images downloaded from Wix"
          git push
