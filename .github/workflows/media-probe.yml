name: Media probe (temporary)
on:
  push:
    branches: [media-completion]
    paths: [".github/workflows/media-probe.yml", "scripts/media_probe.cjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          mkdir tools && cd tools && npm init -y >/dev/null
          npm i playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp ../scripts/media_probe.cjs . && (node media_probe.cjs ../_probe 2>&1 | tee ../_probe-log.txt; true)
          mkdir -p ../_probe && cp ../_probe-log.txt ../_probe/log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f _probe
          git commit -qm "Media probe results (temporary)" || echo nothing
          git pull -q --rebase
          git push
