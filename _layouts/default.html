<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}NanaFitMama · Nana Milatić</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ '/assets/css/subpage.css' | relative_url }}"/>
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}"/>
{% feed_meta %}
</head>
<body>

<div id="bar"></div>

{%- capture contact_url %}{{ '/index.html' | relative_url }}#contact{% endcapture %}
<!-- ═══ NAV ═══ -->
{% include nav.html active="blog" contact=contact_url %}

{{ content }}

<!-- wave → footer -->
<div class="wave" style="background:var(--cream)">
  <svg viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,40 C300,90 700,10 1100,60 C1270,85 1380,35 1440,50 L1440,90 L0,90 Z" fill="#1E1426"/>
  </svg>
</div>

<!-- ═══ FOOTER ═══ -->
{% include footer.html contact=contact_url %}

<script src="{{ '/assets/js/subpage.js' | relative_url }}"></script>
</body>
</html>
