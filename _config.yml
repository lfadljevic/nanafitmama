# NanaFitMama – Jekyll configuration (GitHub Pages)

title: NanaFitMama
description: Prenatal & postnatal fitness – Nana Milatić
lang: hr
timezone: Europe/Zagreb
author: Nana Milatić

# ── Site address ───────────────────────────────────────────────
# The site lives on its own domain (GitHub Pages, custom domain).
# baseurl stays empty. (Before the domain switch it was "/nanafitmama".)
url: "https://www.nanamilatic.com"
baseurl: ""

# ── Blog ───────────────────────────────────────────────────────
# Post address: /post/<title-from-file-name>/   (same pattern as the old Wix blog)
# Post files:   _posts/YYYY-MM-DD-title.md
# (Set for posts only, so the existing pages keep addresses like /o-meni.html)
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      permalink: /post/:title/

# Keep quotation marks exactly as typed (no automatic curly quotes)
kramdown:
  smart_quotes: apos,apos,quot,quot

plugins:
  - jekyll-feed
  - jekyll-redirect-from   # keeps old Wix addresses working (redirect_from in front matter)

# Files that are part of the repository but not of the website
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - node_modules
